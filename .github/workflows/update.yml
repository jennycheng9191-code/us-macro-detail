name: 更新拆項數值

on:
  schedule:
    # 沿用 us-macro-guide 已驗證過的排程時間與避開congestion的理由：
    # 別排 UTC 00:00 或整點，公開 repo 排程優先序低，容易遲到超過10小時。
    # 排兩次對延遲避險，任一次準時就趕得上台北上班前。
    - cron: '47 19 * * *'
    - cron: '47 22 * * *'
  workflow_dispatch:        # 重要數據公布後想立刻更新時，手動按這個
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/mapping.json'
      - 'data/indicators.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 抓取並組裝 latest.json
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/build.py

      - name: 檢查產出是否可用
        # 防呆：如果多數拆項都掛掉（例如金鑰過期），就讓流程失敗並保留舊資料，
        # 不要把一份幾乎全空的 latest.json 推上去。67項中綠燈低於50判定異常。
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/latest.json", encoding="utf-8"))
          s = d["summary"]
          total = sum(s.values())
          print(f"綠燈 {s['green']} / 黃燈 {s['yellow']} / 未取得 {s['gray']}（共 {total}）")
          if s["green"] < 50:
              print("::error::綠燈少於 50 項，判定抓取異常，中止更新以保留上一版資料")
              sys.exit(1)
          PY

      - name: 同步一份到 site/data 供網頁讀取
        run: cp data/latest.json site/data/latest.json

      - name: 提交變更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/latest.json site/data/latest.json; then
            echo "數值沒有變化，不需提交"
            exit 0
          fi
          git add data/latest.json site/data/latest.json
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          echo "COMMITTED=1" >> "$GITHUB_ENV"

          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 被拒絕（第 $i 次），fetch 後重新合併再試"
            git fetch origin main
            git merge -X ours origin/main -m "合併：保留本次新抓的資料"
          done
          echo "::error::push 重試 5 次仍失敗，資料留在 runner 上未提交"
          exit 1

      - name: 觸發網站部署
        if: env.COMMITTED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
